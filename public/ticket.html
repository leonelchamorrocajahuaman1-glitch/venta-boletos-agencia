<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boleto · Las Cobras Viajes</title>
  <style>
    /* Papel térmico de 58 mm: ~48 mm imprimibles. En el diálogo de impresión elige
       la térmica, tamaño de papel 58 mm (rollo) y márgenes "ninguno". */
    @page { margin: 0; }
    :root { color-scheme: light; }
    body { margin: 0; background: #e9ecef; font-family: "Courier New", ui-monospace, monospace; color: #000; }
    .ticket {
      width: 58mm; margin: 16px auto; padding: 4mm 5mm 6mm; background: #fff; box-sizing: border-box;
      font-size: 11px; line-height: 1.3; box-shadow: 0 2px 10px #0002;
    }
    .centro { text-align: center; }
    .marca { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .ruta { font-size: 15px; font-weight: 700; margin: 2px 0; }
    .sep { border-top: 1px dashed #000; margin: 6px 0; }
    .fila { display: flex; justify-content: space-between; gap: 6px; }
    .fila span:last-child { text-align: right; }
    .grande { font-size: 15px; font-weight: 700; }
    .qr { display: block; width: 36mm; height: 36mm; margin: 6px auto 2px; image-rendering: pixelated; }
    .codigo { font-weight: 700; letter-spacing: 1px; }
    .anulado { border: 2px solid #000; padding: 2px; font-weight: 700; font-size: 14px; }
    .acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px; font-family: system-ui, sans-serif; }
    .acciones button, .acciones a {
      font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #0f7b5f; background: #0f7b5f; color: #fff;
      cursor: pointer; text-decoration: none;
    }
    .acciones .sec { background: #fff; color: #0f7b5f; }
    .aviso { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 8px 14px; border-radius: 8px; font-family: system-ui, sans-serif; }
    .aviso.error { background: #c62828; }
    #error { font-family: system-ui, sans-serif; text-align: center; color: #c62828; }
    @media print {
      body { background: #fff; }
      .ticket { margin: 0; width: 58mm; box-shadow: none; }
      .acciones, #error { display: none; }
    }
  </style>
</head>
<body>
  <div class="acciones">
    <button id="btn-imprimir">🖨 Imprimir (navegador)</button>
    <button id="btn-red" class="sec" hidden>📡 Enviar a térmica de red</button>
    <a id="btn-escpos" class="sec">⬇ Descargar ESC/POS</a>
  </div>
  <p id="error"></p>
  <div id="ticket" class="ticket" hidden></div>
  <script type="module" src="ticket.js"></script>
</body>
</html>
